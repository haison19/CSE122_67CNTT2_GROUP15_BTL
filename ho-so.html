<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixFlow · Hồ sơ | Người yêu cầu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-trang="ho-so">

  <aside class="thanh-ben" id="thanh-ben">
    <a class="logo" href="index.html">
      <span class="logo-o">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </span>
      <span class="ten-logo">FixFlow</span>
    </a>
    <div class="nhom-nguoi-dung">Người yêu cầu</div>
    <ul class="danh-sach-menu">
      <li><a class="lien-ket-menu" href="index.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Tổng quan</a></li>
      <li><a class="lien-ket-menu" href="tao-ticket.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v2M14 11v2M14 16v2"/></svg>
        Tạo Ticket</a></li>
      <li><a class="lien-ket-menu" href="ticket-cua-toi.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 6l1.6 1.6L8 4.2"/><path d="M3 12l1.6 1.6L8 10.2"/><path d="M3 18l1.6 1.6L8 16.2"/></svg>
        Ticket của tôi</a></li>
      <li><a class="lien-ket-menu" href="thong-bao.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
        Thông báo<span class="nhan-thong-bao" id="so-thong-bao">0</span></a></li>
      <li><a class="lien-ket-menu dang-chon" href="ho-so.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
        Hồ sơ</a></li>
      <li><a class="lien-ket-menu" href="cai-dat.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
        Cài đặt</a></li>
    </ul>
    <ul class="danh-sach-menu lien-ket-cuoi">
      <li><a class="lien-ket-menu" href="#" data-chuc-nang="tro-giup">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
        Trợ giúp 24/7</a></li>
    </ul>
  </aside>

  <div class="khung-chinh">
    <header class="thanh-tren">
      <button class="nut-menu" id="nut-menu" aria-label="Mở menu">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="o-tim-kiem">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="tim-kiem-toan-bo" type="search" placeholder="Tìm ticket, thiết bị, người dùng...">
      </div>
      <div class="phai-thanh-tren">
        <button class="nut-chuong" id="nut-thong-bao" aria-label="Thông báo">
          <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
          <span class="so-thong-bao" id="so-thong-bao-dau">0</span>
        </button>
        <div class="thong-tin-nguoi-dung">
          <span class="anh-dai-dien" id="anh-dai-dien">N</span>
          <span id="ten-nguoi-dung">Nguyễn Văn A</span>
        </div>
      </div>
    </header>

    <div class="noi-dung">
      <div>
        <h1 class="tieu-de-trang">Hồ sơ cá nhân</h1>
        <p class="chu-thich" id="mo-dau-ho-so"></p>
      </div>

      <!-- Thẻ đầu: ảnh đại diện, tên, chức vụ, nút tải ảnh -->
      <div class="the dau-ho-so">
        <div class="anh-dai-dien lon" id="anh-dai-dien-ho-so">N</div>
        <div>
          <h2 class="ten-ho-so" id="ten-ho-so"></h2>
          <span class="nhan nhan-xanh" id="badge-chuc-vu"></span>
        </div>
        <button class="nut nut-phu" id="nut-tai-anh" style="margin-left:auto">Tải ảnh mới</button>
        <input type="file" id="dau-vao-anh-dai-dien" accept="image/png,image/jpeg" hidden>
      </div>

      <div class="hang-tab" id="hang-tab-ho-so">
        <button class="tab dang-chon" data-nhom="thong-tin">Thông tin cá nhân</button>
        <button class="tab" data-nhom="mat-khau">Mật khẩu</button>
        <button class="tab" data-nhom="hoat-dong">Hoạt động</button>
      </div>

      <section class="luoi-hai-cot">
        <div>
          <!-- Tab 1: Thông tin cá nhân -->
          <div class="the" id="tab-thong-tin">
            <div class="hang-hai-o">
              <div class="nhom-truong">
                <label class="nhan-truong" for="ho-so-ten">Họ tên</label>
                <input class="o-nhap" id="ho-so-ten">
              </div>
              <div class="nhom-truong">
                <label class="nhan-truong" for="ho-so-ma-nhan-vien">Mã nhân viên</label>
                <input class="o-nhap" id="ho-so-ma-nhan-vien">
              </div>
            </div>
            <div class="hang-hai-o">
              <div class="nhom-truong">
                <label class="nhan-truong" for="ho-so-email">Email</label>
                <input class="o-nhap" id="ho-so-email" type="email">
              </div>
              <div class="nhom-truong">
                <label class="nhan-truong" for="ho-so-dien-thoai">SĐT</label>
                <input class="o-nhap" id="ho-so-dien-thoai" type="tel">
              </div>
            </div>
            <div class="nhom-truong">
              <label class="nhan-truong" for="ho-so-phong-ban">Phòng ban</label>
              <input class="o-nhap" id="ho-so-phong-ban">
            </div>
            <button class="nut nut-chinh" id="nut-luu-ho-so">Lưu thay đổi</button>
          </div>

          <!-- Tab 2: Mật khẩu (chỉ mô phỏng, không lưu mật khẩu) -->
          <div class="the an" id="tab-mat-khau">
            <div class="nhom-truong">
              <label class="nhan-truong" for="mk-hien-tai">Mật khẩu hiện tại</label>
              <input class="o-nhap" id="mk-hien-tai" type="password" autocomplete="off">
            </div>
            <div class="hang-hai-o">
              <div class="nhom-truong">
                <label class="nhan-truong" for="mk-moi">Mật khẩu mới (tối thiểu 6 ký tự)</label>
                <input class="o-nhap" id="mk-moi" type="password" autocomplete="off">
              </div>
              <div class="nhom-truong">
                <label class="nhan-truong" for="mk-xac-nhan">Nhập lại mật khẩu mới</label>
                <input class="o-nhap" id="mk-xac-nhan" type="password" autocomplete="off">
              </div>
            </div>
            <p class="chu-thich">Website không có máy chủ nên mật khẩu không được lưu hay gửi đi đâu; đây chỉ là luồng kiểm tra trên giao diện.</p>
            <button class="nut nut-chinh" id="nut-doi-mat-khau">Đổi mật khẩu</button>
          </div>

          <!-- Tab 3: Hoạt động (điền bằng JavaScript từ hộp thông báo) -->
          <div class="the an" id="tab-hoat-dong"></div>
        </div>

        <div class="cot-phai">
          <div class="the">
            <h2 class="tieu-de-the">Hoạt động gần đây</h2>
            <div id="hoat-dong-gan-day"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
