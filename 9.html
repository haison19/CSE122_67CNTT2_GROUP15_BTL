<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixFlow - 404 Trang không tồn tại</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="9.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex h-screen items-center justify-center overflow-hidden">

    <!-- CONTAINER -->
    <div class="flex flex-col items-center text-center max-w-md px-6 space-y-6">
        
        <!-- Logo FixFlow -->
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/30">
                <i class="fa-solid fa-screwdriver-wrench text-sm"></i>
            </div>
            <span class="text-lg font-bold tracking-wide text-slate-900">FixFlow</span>
        </div>

        <!-- Wrench Icon Illustration -->
        <div class="text-blue-500 text-5{-px} py-2">
            <i class="fa-solid fa-screwdriver-wrench text-5xl opacity-80 transform -rotate-45"></i>
        </div>

        <!-- 404 & Message -->
        <div class="space-y-2">
            <h1 class="text-6xl font-black text-slate-900 tracking-tight">404</h1>
            <h2 class="text-xl font-bold text-slate-800">Trang không tồn tại</h2>
            <p class="text-sm text-slate-500">Trang đã được di chuyển hoặc không còn tồn tại.</p>
        </div>

        <!-- Search Box -->
        <div class="w-full relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" placeholder="Tìm kiếm trong FixFlow..." class="w-full bg-white border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center space-x-3 w-full justify-center">
            <button onclick="window.location.href='index.html'" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition">
                Về trang chủ
            </button>
            <button onclick="alert('Đã gửi báo lỗi hệ thống!')" class="px-5 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-xl shadow-sm transition">
                Báo lỗi
            </button>
        </div>

        <!-- Footer Note -->
        <div class="text-xs text-slate-400 pt-2 flex items-center justify-center space-x-1.5">
            <i class="fa-regular fa-face-sad-tear"></i>
            <span>Fixy cũng hơi buồn vì đường dẫn này không hoạt động.</span>
        </div>

    </div>

    <!-- Custom JS File -->
    <script src="9.js"></script>
</body>
</html>
