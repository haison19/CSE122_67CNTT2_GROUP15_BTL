<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixFlow · Ticket của tôi | Người yêu cầu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-trang="danh-sach">

  <aside class="thanh-ben" id="thanh-ben">
    <a class="logo" href="index.html">
      <span class="logo-o">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M15 3a5 5 0 0 0-4.3 7.5L4 17.2V20h2.8l6.7-6.7A5 5 0 1 0 15 3z"/><path d="M6.6 17.4h.01"/></svg>
      </span>
      <span class="ten-logo">FixFlow</span>
    </a>
    <div class="nhom-nguoi-dung">Người yêu cầu</div>
    <ul class="danh-sach-menu">
      <li><a class="lien-ket-menu" href="index.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Tổng quan</a></li>
      <li><a class="lien-ket-menu" href="tao-ticket.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v2M14 11v2M14 16v2"/></svg>
        Tạo Ticket</a></li>
      <li><a class="lien-ket-menu dang-chon" href="ticket-cua-toi.html">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M3 6l1.6 1.6L8 4.2"/><path d="M3 12l1.6 1.6L8 10.2"/><path d="M3 18l1.6 1.6L8 16.2"/></svg>
        Ticket của tôi</a></li>
    </ul>
    <!--
      Phân hệ Người yêu cầu chỉ hiển thị 3 mục menu: Tổng quan, Tạo Ticket, Ticket của tôi.
      Các mục Thông báo, Hồ sơ, Cài đặt, Trợ giúp 24/7 đã được ẩn khỏi menu của phân hệ này
      để không xung đột khi ghép với code của các thành viên khác.
    -->
  </aside>

  <div class="khung-chinh">
    <header class="thanh-tren">
      <button class="nut-menu" id="nut-menu" aria-label="Mở menu">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="o-tim-kiem">
        <svg class="bieu-tuong" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="tim-kiem-toan-bo" type="search" placeholder="Tìm ticket, thiết bị, người dùng...">
      </div>
      <div class="phai-thanh-tren">
        <button class="nut-chuong" id="nut-thong-bao" aria-label="Thông báo">
          <svg class="bieu-tuong" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
          <span class="so-thong-bao" id="so-thong-bao-dau">0</span>
        </button>
        <div class="thong-tin-nguoi-dung">
          <span class="anh-dai-dien" id="anh-dai-dien">N</span>
          <span id="ten-nguoi-dung">Nguyễn Văn A</span>
        </div>
      </div>
    </header>

    <div class="noi-dung">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
        <h1 class="tieu-de-trang">Ticket của tôi</h1>
        <a class="nut nut-chinh" href="tao-ticket.html">Tạo Ticket Mới</a>
      </div>

      <!-- Bộ lọc -->
      <div class="luoi-bo-loc">
        <div class="o-tim-kiem" style="width:100%">
          <svg class="bieu-tuong" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="tim-kiem-danh-sach" type="search" placeholder="Tìm kiếm theo mã hoặc tiêu đề...">
        </div>
        <select class="o-chon" id="loc-trang-thai">
          <option value="tat-ca">Trạng thái</option>
          <option value="Mới">Mới</option>
          <option value="Chờ nhận">Chờ nhận</option>
          <option value="Chờ bổ sung">Chờ bổ sung</option>
          <option value="Đang xử lý">Đang xử lý</option>
          <option value="Chờ linh kiện">Chờ linh kiện</option>
          <option value="Hoàn thành">Hoàn thành</option>
          <option value="Hủy">Hủy</option>
        </select>
        <select class="o-chon" id="loc-muc-do">
          <option value="tat-ca">Mức độ</option>
          <option value="Thấp">Thấp</option>
          <option value="Trung bình">Trung bình</option>
          <option value="Cao">Cao</option>
          <option value="Khẩn">Khẩn</option>
        </select>
        <select class="o-chon" id="loc-thoi-gian">
          <option value="tat-ca">Thời gian</option>
          <option value="hom-nay">24 giờ qua</option>
          <option value="7-ngay">7 ngày qua</option>
          <option value="30-ngay">30 ngày qua</option>
        </select>
        <button class="nut nut-phu" id="nut-dat-lai">Đặt lại</button>
      </div>

      <!-- Tab -->
      <div class="hang-tab">
        <button class="tab dang-chon" data-nhom="tat-ca">Tất cả <span id="so-tat-ca">0</span></button>
        <button class="tab" data-nhom="dang-xu-ly">Đang xử lý <span id="so-dang-xu-ly-tab">0</span></button>
        <button class="tab" data-nhom="hoan-thanh">Hoàn thành <span id="so-hoan-thanh-tab">0</span></button>
      </div>

      <!-- Bảng ticket -->
      <div class="bang-bao-vo">
        <table class="bang">
          <thead>
            <tr><th>Mã ticket</th><th>Sự cố</th><th>Ưu tiên</th><th>Trạng thái</th><th>SLA</th></tr>
          </thead>
          <tbody id="bang-ticket"></tbody>
        </table>
      </div>

      <div class="khung-phan-trang">
        <div id="thong-tin-trang" class="chu-thich"></div>
        <div class="danh-sach-trang" id="phan-trang"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
