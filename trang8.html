<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="trang8.css">
</head>

      <p class="error-code">403</p>
      <h1 id="errorTitle">Truy cập bị từ chối</h1>
      <p class="error-description">Bạn không có quyền truy cập trang này.<br>Vui lòng liên hệ quản trị viên nếu bạn cho rằng đây là nhầm lẫn.</p>
      <button class="home-button" id="reloadPage" type="button">Tải lại trang</button>
    </section>
    <footer>© 2025 FixFlow · Hệ thống quản lý Ticket</footer>
  </main>
  <script src="trang8.js" defer></script>

</html>
